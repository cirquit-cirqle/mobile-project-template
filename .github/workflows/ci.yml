name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: 静的解析・フォーマットチェック
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          cache: true

      - name: 依存パッケージの取得
        run: flutter pub get

      - name: Dart フォーマットチェック
        run: dart format --set-exit-if-changed .

      - name: 静的コード解析
        run: flutter analyze --fatal-infos

  test:
    name: テスト実行
    runs-on: ubuntu-latest
    needs: analyze
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          cache: true

      - name: 依存パッケージの取得
        run: flutter pub get

      - name: ユニット・ウィジェットテスト実行
        run: flutter test --coverage --reporter expanded

      - name: テストカバレッジレポート
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

  build-web:
    name: Web ビルド
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          cache: true

      - name: 依存パッケージの取得
        run: flutter pub get

      - name: Web ビルド
        run: flutter build web --release

      - name: ビルド成果物のアップロード
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: build/web/
          retention-days: 7

  build-android:
    name: Android ビルド
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          cache: true

      - name: 依存パッケージの取得
        run: flutter pub get

      - name: Android APK ビルド
        run: flutter build apk --release

      - name: ビルド成果物のアップロード
        uses: actions/upload-artifact@v4
        with:
          name: android-build
          path: build/app/outputs/flutter-apk/
          retention-days: 7

  build-ios:
    name: iOS ビルド
    runs-on: macos-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          cache: true

      - name: 依存パッケージの取得
        run: flutter pub get

      - name: iOS ビルド（署名なし）
        run: flutter build ios --release --no-codesign

      - name: ビルド成果物のアップロード
        uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: build/ios/iphoneos/
          retention-days: 7
